[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# The post used to be published at a slug ending in "-draft".
[[redirects]]
  from = "/blog/hfe-appeal-overseas-property-draft"
  to = "/blog/hfe-appeal-overseas-property/"
  status = 301

[[redirects]]
  from = "/blog/hfe-appeal-overseas-property-draft/"
  to = "/blog/hfe-appeal-overseas-property/"
  status = 301
